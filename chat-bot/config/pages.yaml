default:
  match: /
  service: null
  opening: >
    Hello! I'm here to help you with your B2B software consulting needs.
    I can help you define the product, sanity-check scope, and see if we're a fit
    before you speak with anyone on our side.
  extra_questions:
    - What are you looking to build?
pages:
  - match: /mobile-app-development
    service: mobile_app
    opening: >
      Planning a mobile product? I'll help you shape the MVP, recommend a stack,
      and share a preliminary range before you talk to the team.
    extra_questions:
      - iOS, Android, or both?
      - Who is the first user?
  - match: /web-app-development
    service: web_app
    opening: >
      Building a web product or SaaS? I'll gather the essentials, suggest an architecture,
      and give you an indicative estimate you can take to stakeholders.
    extra_questions:
      - Is this customer-facing or internal?
      - Do you already have users or a design?
  - match: /ai-development
    service: ai_product
    opening: >
      Exploring an AI product? I'll map the use case, data, and guardrails,
      then outline an MVP and an honest first-pass range.
    extra_questions:
      - What should the assistant actually do for the user?
      - Do you already have documents or systems it should read?
  - match: /ui-ux-design
    service: ui_ux
    opening: >
      Looking at product design? I'll help you frame the surface, the first journey,
      and whether a prototype should land before engineering ramps.
    extra_questions:
      - Is this a new product, a redesign, or a prototype to test?
      - Mobile, web, or both?
  - match: /staff-augmentation
    service: staff_augmentation
    opening: >
      Need embedded engineers or designers? I'll map the roles, the stack they will join,
      and an indicative retainer range — not a hiring promise.
    extra_questions:
      - Which roles do you need first?
      - What stack will they join?
  - match: /work/harvest
    service: mobile_app
    opening: >
      Harvest was a two-sided mobile marketplace MVP. If you are scoping something similar,
      I'll help you cut the first corridor, pick a stack, and share a preliminary range.
    extra_questions:
      - iOS, Android, or both?
      - Who is the first user — grower, buyer, or both in v1?
  - match: /work/riverview
    service: mobile_app
    opening: >
      Riverview was a HIPAA-aware patient companion. If you are planning a health or companion app,
      I'll help you name the first user, the first journey, and an honest first-release cut.
    extra_questions:
      - iOS, Android, or both?
      - Who is the first user?
  - match: /work/ledgerly
    service: web_app
    opening: >
      Ledgerly replaced spreadsheet ops with a role-based web console. If you are scoping
      an internal or SaaS product, I'll gather the essentials and share an indicative range.
    extra_questions:
      - Is this customer-facing or internal?
      - Do you already have users or a design?
  - match: /work/atlas
    service: ai_product
    opening: >
      Atlas grounded RFP drafts in a 12,000-page corpus. If you are exploring a similar assistant,
      I'll map the job, the documents it can read, and an honest first-pass range.
    extra_questions:
      - What should the assistant actually do for the user?
      - Do you already have documents or systems it should read?
  - match: /work/northstar
    service: ui_ux
    opening: >
      Northstar was a B2B onboarding redesign. If you need product design before engineering,
      I'll help you frame the surface and whether a prototype should come first.
    extra_questions:
      - Is this a new product, a redesign, or a prototype to test?
      - What does activation look like today?
  - match: /work
    service: null
    opening: >
      I can walk you through work that is close to what you are building — mobile, web, AI,
      or design — then help you shape an MVP and an indicative range.
    extra_questions:
      - What are you looking to build?
  - match: /pricing
    service: null
    opening: >
      Happy to walk through how we scope and price work. Tell me what you're building
      and I'll give an indicative range — not a formal quote.
    extra_questions:
      - What kind of product is this?
  - match: /contact
    service: null
    opening: >
      Happy to start here. Tell me what you want to build and I'll help you shape an MVP,
      sanity-check scope, and share an indicative range before you speak with a strategist.
    extra_questions:
      - What are you looking to build?
  - match: /about
    service: null
    opening: >
      DevConsult is a B2B software consultancy — we help teams define, design, and ship
      custom software with a named delivery lead. Tell me what you want to build and I'll
      sanity-check scope before you speak with anyone on our side.
    extra_questions:
      - What are you looking to build?
  - match: /process
    service: null
    opening: >
      An engagement starts with discovery, an MVP cut on an approved stack, then a strategist
      to confirm the real number. Tell me the product and I'll walk the first-release cut —
      not a go-live date we cannot own.
    extra_questions:
      - What are you looking to build?
  - match: /careers
    service: null
    opening: >
      If you are here about a role, mention which one and I will point you to hello@devconsult.example.
      If you are here about a product we should build, tell me what it is and I'll help shape an MVP.
    extra_questions:
      - Are you here about a role, or about a product we should build?
  - match: /insights/grounding-ai
    service: ai_product
    opening: >
      Grounding an AI product starts with the job and the corpus — not a model that invents sources.
      I'll map what the assistant should do, what it can read, and an honest first-pass range.
    extra_questions:
      - What should the assistant actually do for the user?
      - Do you already have documents or systems it should read?
  - match: /insights/mvp-first
    service: null
    opening: >
      We start with one user and one journey — not the platform you will need in year three.
      Tell me who the first user is and I'll help cut a first release you can take to stakeholders.
    extra_questions:
      - Who is the first user, and what must ship for them?
  - match: /insights/indicative-ranges
    service: null
    opening: >
      A number from this chat is an indicative range you can take to stakeholders, not a contract.
      Tell me what you're building and I'll share a low-side first pass — a strategist confirms the quote.
    extra_questions:
      - What kind of product is this?
  - match: /insights
    service: null
    opening: >
      These notes cover MVP cuts, indicative ranges, and grounded AI. Tell me what you want to build
      and I'll apply the same thinking — first user, first journey, honest first-pass range.
    extra_questions:
      - What are you looking to build?
  - match: /privacy
    service: null
    opening: >
      This page is a dummy privacy note for the demo — I cannot give legal advice.
      If you want help scoping a product, tell me what you're building and I'll stay on discovery.
    extra_questions:
      - What are you looking to build?
  - match: /terms
    service: null
    opening: >
      These are dummy terms for the demo site — they do not create a delivery contract, and I cannot
      give legal advice. If you want to scope a product, tell me what you're building.
    extra_questions:
      - What are you looking to build?
  - match: /demo
    service: null
    opening: >
      Hello! I'm here to help you with your B2B software consulting needs.
      How can I assist you today?
    extra_questions:
      - What are you looking to build?
