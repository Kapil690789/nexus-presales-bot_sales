# Retrieval and learning behaviour. The vector store is a derived index over the
# other files in this folder — edit those, then re-run ingest (`make ingest`).
top_k: 4
lesson_k: 3
min_score: 0.20
max_snippet_chars: 480
# Chunks one document may contribute to a single answer. Long case studies would
# otherwise fill every slot and crowd out the rest of the corpus.
max_chunks_per_doc: 2
# Similarity a visitor message needs before it counts as a known objection.
objection_min_score: 0.55
# The local hashing embedder produces much smaller cosine values than a trained
# model (a clear match lands near 0.15, unrelated text under 0.10), so it needs
# its own floor. Used automatically whenever no embedding API key is configured.
# Calibrated against the objection triggers in objections.yaml — widen the triggers
# rather than dropping this floor, since below about 0.11 ordinary questions start
# being read as objections.
objection_min_score_local: 0.12
sources:
  # Structured facts in this folder; also drives pricing and scoring.
  config: true
  # Long-form library in ../content, owned by the sales team.
  content: true
  fixtures: true
  website: false
  website_dir: ../website
redaction:
  emails: true
  phones: true
  urls: true
  proper_nouns: true
learning:
  enabled: true
  # Sessions score at least this much to be learned from as a success.
  # Null uses qualification.book_threshold so there is one place to tune the gate.
  min_score: null
  # Distil disqualified, objected, and abandoned chats as well as conversions.
  include_failed: true
  # Abandoned backfill ignores sessions with fewer visitor messages than this.
  min_visitor_messages: 3
  # Minutes of inactivity before a non-converting session counts as abandoned.
  abandon_after_minutes: 30
  # How much a proven case study can outrank a better keyword match.
  outcome_boost: 2.0
  # Wins are smoothed by this many pseudo-sessions so one lucky chat cannot dominate.
  outcome_prior: 3
