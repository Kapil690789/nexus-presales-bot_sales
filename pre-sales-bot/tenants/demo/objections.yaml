items:
  too_expensive:
    topic: pricing
    triggers: [expensive, too much, cheaper, reduce the price, budget is tight, too high, way too high, discount, out of budget, out of my budget, can't afford, cannot afford, lower the price, lower price, cut the scope, can you do it for]
    reply: >
      The number I shared is a low-side indicative range for the MVP we outlined,
      not a take-it-or-leave-it quote. We can usually protect the budget by cutting
      phase-two features or scoping a Lean Core MVP version focused on day-one value.
  too_slow:
    topic: delivery
    triggers: [too long, faster, need it next month, timeline is too slow, too slow, hurry, rush, deliver sooner, deliver faster]
    reply: >
      The timeline assumes a dedicated senior team and thorough QA. If your launch date is fixed,
      we can fast-track delivery by scoping a rapid Sprint 1 MVP with battle-tested components
      rather than promising an untested full release.
  equity_or_deferred:
    topic: commercial
    triggers: [equity, revenue share, rev share, pay later, after funding, after we raise, deferred payment, work for equity]
    reply: >
      Nexus operates exclusively on a cash-for-service model and does not accept equity,
      revenue share, or deferred compensation contingent on future fundraising.
      To work within an early-stage budget, we recommend staging a lean Phase 1 MVP
      focused strictly on your core revenue-generating workflow.
  need_fixed_price:
    topic: pricing
    triggers: [fixed price, fixed bid, lump sum, not time and materials]
    reply: >
      We can work toward a fixed commercial once discovery is locked. Until then an indicative
      range keeps both sides honest about technical uncertainty.
  offshore_quality:
    topic: team
    triggers: [offshore, cheap developers, outsourced]
    reply: >
      We staff a named delivery lead and keep the core team stable. The consultation is where
      we introduce who would actually do the work.
  tax_bad_advice:
    topic: compliance
    triggers: [wrong advice, hallucinate, sued, audit, bad tax advice, inaccurate advice]
    reply: >
      The AI is restricted by strict IRS Circular 230 guardrails to intake triage,
      document collection, and scheduling. It never generates unreviewed tax positions
      and hands off complex inquiries to your licensed CPAs.
  tax_security_ssn:
    topic: security
    triggers: [ssn safe, leak tax data, privacy leak, steal tax docs, ssn breach]
    reply: >
      All tax forms and client records are encrypted with AES-256 and compliant with
      IRS Pub 1075 protocols. SSNs and financial identifiers are masked before LLM
      processing, and client data is never used to train models.

