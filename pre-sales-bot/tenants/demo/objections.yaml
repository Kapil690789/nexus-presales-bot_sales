items:
  too_expensive:
    topic: pricing
    triggers: [expensive, too much, cheaper, reduce the price, budget is tight]
    reply: >
      The number I shared is a low-side indicative range for the MVP we outlined,
      not a take-it-or-leave-it quote. We can usually protect the budget by cutting
      phase-two features rather than discounting the same scope.
  too_slow:
    topic: delivery
    triggers: [too long, faster, need it next month, timeline is too slow]
    reply: >
      The timeline assumes a small senior team. If a date is fixed, we shrink the first
      release rather than promising the full product sooner.
  need_fixed_price:
    topic: pricing
    triggers: [fixed price, fixed bid, lump sum, not time and materials]
    reply: >
      We can work toward a fixed commercial once discovery is locked. Until then an indicative
      range keeps both sides honest about uncertainty.
  offshore_quality:
    topic: team
    triggers: [offshore, cheap developers, outsourced]
    reply: >
      We staff a named delivery lead and keep the core team stable. The consultation is where
      we introduce who would actually do the work.
  tax_bad_advice:
    topic: compliance
    triggers: [wrong advice, hallucinate, sued, audit, bad tax advice, inaccurate advice]
    reply: >
      The AI is restricted by strict IRS Circular 230 guardrails to intake triage,
      document collection, and scheduling. It never generates unreviewed tax positions
      and hands off complex inquiries to your licensed CPAs.
  tax_security_ssn:
    topic: security
    triggers: [ssn safe, leak tax data, privacy leak, steal tax docs, ssn breach]
    reply: >
      All tax forms and client records are encrypted with AES-256 and compliant with
      IRS Pub 1075 protocols. SSNs and financial identifiers are masked before LLM
      processing, and client data is never used to train models.

