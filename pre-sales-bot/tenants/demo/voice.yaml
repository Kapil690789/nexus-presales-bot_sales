questions:
  service:
    - "What type of product are you planning to build — web app, mobile app, AI system, or product design?"
    - "To get started, what kind of digital software product are you looking to create?"
  goal:
    - "What primary problem or workflow should this initial release solve for your users?"
    - "What's the main goal or user journey you want to launch with?"
  platforms:
    - "Which platforms should we target for the first launch — web, iOS, Android, or cross-platform mobile?"
    - "Where will your target users primarily access this application — web browsers, mobile devices, or both?"
  features:
    - "What key features are essential for day one — what do users need to be able to do?"
    - "Which core capabilities or workflows should we prioritize for the launch?"
  feature_detail:
    - "Could you describe in a sentence what users will do within those initial capabilities?"
    - "What specific actions or workflows should those initial features enable?"
  user_flow:
    - "If you already have a user journey in mind (sign-up, core action, result), sketch it for me, or skip this step."
    - "How do you picture a visitor moving through the application from first screen to result (sketch it or skip)?"
  users:
    - "Who will be using this first — direct consumers, business clients, or internal team members?"
    - "What audience is this initial release designed for — consumer users, business accounts, or your operations team?"
  integrations:
    - "Are there any external services or APIs this must connect with on day one, like payments, CRM, or existing databases?"
    - "Will the first release need integrations with third-party tools, like Stripe, auth providers, or existing databases?"
  timeline:
    - "What launch timeline are you aiming for to get this initial product into users' hands?"
    - "What timeframe makes sense for getting this first release live?"
  budget_band:
    - "What investment range makes sense for this initial build to help calibrate team composition and architecture?"
    - "What rough budget scale makes sense for this first release to help calibrate our architecture recommendations?"
  decision_role:
    - "What is your role on the project when architecture and delivery decisions are made?"
    - "Are you leading this as founder, product manager, operations lead, or another role?"
  company_size:
    - "What stage is your organization today — early startup, growing business, or enterprise team?"
    - "Roughly what stage is the company — early-stage venture, mid-market business, or enterprise team?"

acks:
  goal:
    - "{goal_short} — that gives us a clear focus for the initial release."
    - "Building for {goal_short} solves a clear, high-impact need right from launch."
  features:
    - "{features_list} gives us a solid, focused foundation for launch."
    - "Focusing on {features_list} keeps the initial release lean and high-impact."
  platforms:
    - "Targeting {platforms} gives us a clear path for the front-end experience."
    - "Building for {platforms} ensures your users can access it seamlessly."
  timeline:
    - "Targeting {timeline_label} gives us a defined delivery window."
    - "Working toward {timeline_label} sets a realistic development pace."
  service:
    - "A {service_label} gives us a great starting foundation."
    - "Focusing on a {service_label} gives us a clear technical direction."

scope_coach: "That's a rich list. A lean first release usually keeps cost and risk down, so I'll split it into Core and Later for you."

banned_phrases:
  - "Love it"
  - "Great idea"
  - "Smart approach"
  - "Awesome"
  - "Exciting"
  - "v1"

emoji_max: 1
max_chars: 320
