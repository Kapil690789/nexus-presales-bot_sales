services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: presales
      POSTGRES_PASSWORD: presales
      POSTGRES_DB: presales
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presales"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "8010:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql+pg8000://presales:presales@db:5432/presales
      CORS_ORIGINS: http://localhost:8010,http://127.0.0.1:8010
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      LLM_PROVIDER: gemini
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8010/admin/google/callback}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
