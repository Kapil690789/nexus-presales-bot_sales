<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northline Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #1A2B4C; --muted: #5C6670; --silver: #F4F5F7; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: var(--navy);
      background: var(--silver);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    main {
      max-width: 520px;
      text-align: center;
    }
    h1 { font-size: 1.75rem; margin: 0 0 8px; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Northline Advisor</h1>
    <p>Open the chat in the corner to scope a product, get an indicative range, and book a call.</p>
  </main>
  <script src="/widget/consultant.js" data-api="" data-tenant="demo" async></script>
</body>
</html>
