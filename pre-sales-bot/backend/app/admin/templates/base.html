<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Pre-sales admin{% endblock %}</title>
  <style>
    body { font-family: Georgia, serif; margin: 2rem auto; max-width: 960px; color: #1a2b4c; }
    a { color: #1a2b4c; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
    form { margin: 1rem 0; }
    input, button { font: inherit; padding: 0.35rem 0.5rem; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
